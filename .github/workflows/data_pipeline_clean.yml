name: ManaCore Data Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
  pull_request:
    branches: [main]
    paths:
      - 'data/raw/**'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Get new card info
       # run: python services/download_bulk_carddata.py

      - name: Run pipeline script
        run: python services/run_pipeline.py

      - name: Commit and push updated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.csv
          git diff --cached --quiet || git commit -m "Update processed CSV files [skip ci]"
          git push origin main
