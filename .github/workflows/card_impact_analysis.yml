name: ManaCore Card Impact Analysis

on:
  workflow_dispatch:  # run manually
  # Optional triggers if you ever want automatic runs
  # push:
  #   branches: [main]
  #   paths:
  #     - 'ManaCore/manacore/glm/**'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'ManaCore/manacore/glm/**'

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip and setuptools
        run: python -m pip install --upgrade pip setuptools

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ManaCore as editable package
        run: pip install -e .

      - name: Show installed packages
        run: python -m pip list

      - name: Try importing manacore
        run: python -c "import manacore; print(manacore.__file__)"
        
      - name: Run prepare_data_for_card_impact_analysis.py
        run: |
            python manacore/glm/prepare_data_for_card_impact_analysis.py

      - name: Run card impact analysis
        run: |
            python manacore/glm/card_impact_analysis.py "data/processed/games_for_analysis.csv" output.csv 75

      - name: Remove large CSV
        run: |
          rm -f ManaCore/data/processed/games_for_analysis.csv

      - name: Configure git for committing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated CSV files (excluding large CSV)
        run: |
            git add data/processed/*.csv
            git diff --cached --quiet || git commit -m "Update processed CSV files [skip ci]"
            
      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
