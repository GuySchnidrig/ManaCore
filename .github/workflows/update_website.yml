name: Sync Data to ManaDash

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ManaCore Card Impact Analysis"]
    types: [completed]
    branches: [main]

jobs:
  sync-data:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout ManaCore
        uses: actions/checkout@v6
        with:
          ref: main
          path: manacore

      - name: Checkout ManaDash
        uses: actions/checkout@v6
        with:
          repository: GuySchnidrig/ManaDash
          token: ${{ secrets.MANADASH_TOKEN }}
          ref: main
          path: manadash

      - name: Sync processed data
        run: |
          mkdir -p manadash/data
          rsync -av --delete \
            --include='*/' --include='*.csv' --exclude='*' \
            manacore/data/processed/ manadash/data/

      - name: Commit and push to ManaDash
        working-directory: manadash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes to sync."
          else
            git commit -m "Sync processed data from ManaCore"
            git push origin main
          fi