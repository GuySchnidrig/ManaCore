name: Sync Data to ManaDash

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ManaCore Data Pipeline"]
    types:
      - completed

jobs:
  schedule_task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Update existing PythonAnywhere task
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python - <<'EOF'
          import requests
          from datetime import datetime, timedelta

          username = '${{ secrets.PYTHONANYWHERE_USERNAME }}'
          token = '${{ secrets.PYTHONANYWHERE_API_TOKEN }}'
          headers = {"Authorization": f"Token {token}"}

          # Calculate the next minute in server UTC time
          now = datetime.utcnow()
          next_minute = now + timedelta(minutes=1)
          hour = next_minute.hour
          minute = next_minute.minute

          # Data to update the existing task
          data = {
              "command": "python3.10 /home/GuySchnidrig/update_data.py",
              "enabled": True,
              "description": "Run update_data.py shortly (updated)",
              "interval": "daily",
              "hour": hour,
              "minute": minute
          }

          task_id = 1262825

          r = requests.put(
              f"https://www.pythonanywhere.com/api/v0/user/{username}/schedule/{task_id}/",
              headers=headers,
              json=data
          )

          print("Status:", r.status_code)
          print("Response:", r.text)
          EOF
